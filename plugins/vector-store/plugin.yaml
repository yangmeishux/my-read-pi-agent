name: vector-store
description: 向量检索插件（Chroma + DashScope embedding）
version: 1.0.0

tools:
  - name: rag_query
    description: 对指定书籍执行混合检索（向量 + BM25）
    command: python scripts/query.py
    args:
      - name: book_slug
        type: string
        required: true
      - name: question
        type: string
        required: true
      - name: top_k
        type: integer
        default: 10
