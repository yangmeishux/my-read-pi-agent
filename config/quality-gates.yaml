gates:
  ingest-complete:
    description: 文档解析完成
    checks:
    - name: parsed_file_exists
      type: file_exists
      path_template: library/parsed/{slug}.md
    - name: index_exists
      type: dir_exists
      path_template: library/index/{slug}/
    - name: chunk_count_min
      type: min_value
      field: chunk_count
      value: 10
  summary-quality:
    description: 全书总结质量检查
    checks:
    - name: all_sections_present
      type: sections_check
      required_sections: 10
    - name: citation_count
      type: min_value
      field: citation_count
      value: 5
    - name: citations_have_location
      type: citation_format_check
    - name: banned_phrases_count
      type: max_value
      field: banned_phrases_count
      value: 0
    - name: llm_score
      type: min_value
      field: llm_score
      value: 9
  insight-quality:
    description: 洞见与启发质量检查
    checks:
    - name: insight_count
      type: min_value
      field: insight_count
      value: 3
    - name: insight_actionable
      type: actionable_check
    - name: no_vague_inspirations
      type: banned_patterns_check
  reading-guide-quality:
    description: 阅读标注质量检查
    checks:
    - name: file_exists
      type: file_exists
      path_template: workspace/{slug}/reading-guide.md
    - name: required_sections
      type: sections_check
      required_sections: 5
    - name: close_read_count
      type: range
      field: close_read_chapter_count
      min: 1
      max: 4
    - name: has_skip_or_skim
      type: required_true
      field: has_non_close_read_tag
  digest-quality:
    description: 逐章详述完整性检查
    checks:
    - name: file_exists
      type: file_exists
      path_template: workspace/{slug}/digest.md
    - name: has_overall
      type: sections_check
      required_sections: 1
    - name: cover_all_chapters
      type: required_true
      field: digest_covers_toc
  report-quality:
    description: 最终报告质量检查
    checks:
    - name: all_chapters_present
      type: chapters_check
      required_chapters: 12
    - name: citation_count
      type: min_value
      field: citation_count
      value: 5
    - name: no_banned_phrases
      type: banned_phrases_check
    - name: final_score
      type: min_value
      field: final_score
      value: 9
retry_policy:
  max_retries: 3
  on_fail: rollback_to_summary
  on_exhaust: best_effort
